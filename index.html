<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./asset/images/favicon-32x32.png">

  <title>Frontend Mentor | Conference ticket generator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <img src="/asset/images/logo-full.svg" alt="Logo image">
  </header>
  <div>
    <div class="main-intro">
      <h1>Your Journey to Coding Conf 2025 Starts Here!</h1>
      <p> Secure your spot at next year's biggest coding conference.
      </p>
    </div>
    <form class="form">
      <div class="upload-content">
        <h5>Upload Avatar</h5>
        <div class="upload-box">
          <input type="file" id="file-upload" accept=".jpg, .jpeg, .png" class="upload-input"
            onchange="handleFileUpload(event)" />
          <div for="file-upload" class="upload-placeholder">
            <div class="upload-icon">
              <img src="/asset/images/icon-upload.svg" alt="upload image" id="upload-preview">
            </div>
            <p id="upload-text">Drag and drop or click to upload</p>
          </div>
        </div>
        <div class="upload-info">
          <img src="/asset/images/icon-info.svg" alt="info-icon">
          <p>Upload your photo (JPG or PNG, max size: 500KB).</p>
        </div>
      </div>

      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" for="name" id="name" class="form-input" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" class="form-input" id="email" placeholder="sonibaretimi@gmail.com" required>

        <div class="upload-info" style="display: none;">
          <img src="/asset/images/icon-info.svg" alt="info-icon">
          <p>Upload your photo (JPG or PNG, max size: 500KB).</p>
        </div>
      </div>

      <div class="form-group">
        <label for="github-username">GitHub Username</label>
        <input type="text" class="form-input" id="github-username" name="github-username" placeholder="teeshow04"
          required>
      </div>
      <button type="submit" class="generate-btn">Generate My Ticket</button>
    </form>
  </div>



  <!-- Generated tickets starts

  Congrats, Full Name! Your ticket is ready.

  <!-- We've emailed your ticket to Email Address and will send updates in the run up to the event. -->

</body>

</html>
